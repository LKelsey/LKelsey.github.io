name: Update Publications

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # allow manual trigger

jobs:
  update-pubs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch ADS library and generate publications data
        env:
          ADS_DEV_KEY: ${{ secrets.ADS_DEV_KEY }}
        run: python update_pubs.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml
          git diff --cached --quiet || git commit -m "Auto-update publications from ADS"
          git push
